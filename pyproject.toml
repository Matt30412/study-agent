[project]
name = "study-agent"
version = "0.1.0"
description = "Agente RAG sul materiale di un corso universitario di Intelligenza Artificiale"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "gradio>=6.28.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pypdf>=6.19.0",
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
