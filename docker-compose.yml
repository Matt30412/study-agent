# Servizi di supporto per lo sviluppo locale.
# Ollama non e' qui: va installato sull'host perche' l'accesso alla GPU
# dentro un container richiede una configurazione che varia troppo fra sistemi.

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: study-agent-qdrant
    ports:
      - "6333:6333"   # REST + dashboard web su http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Identita' utente (src/users.py). In Fase 4 ospitera' anche il checkpointer di LangGraph.
  postgres:
    image: postgres:18
    container_name: study-agent-postgres
    environment:
      # Credenziali solo per lo sviluppo locale, le stesse del default di DATABASE_URL.
      POSTGRES_USER: study_agent
      POSTGRES_PASSWORD: study_agent
      POSTGRES_DB: study_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
